[project]
name = "better-anki"
version = "0.1.0"
description = "A calmer, faster web front end for Anki collections"
requires-python = ">=3.10"
dependencies = [
  "anki>=25.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "markdown-it-py>=3.0",
  "mdit-py-plugins>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
better-anki = "better_anki.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["better_anki*"]

[tool.setuptools.package-data]
better_anki = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
