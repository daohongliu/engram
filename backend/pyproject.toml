[project]
name = "engram"
version = "0.1.0"
description = "A flashcard app based on Anki"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "anki>=25.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "markdown-it-py>=3.0",
  "mdit-py-plugins>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
mcp = ["mcp>=2.3,<3", "httpx>=0.27"]

[project.scripts]
engram = "engram.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engram*"]

[tool.setuptools.package-data]
engram = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
